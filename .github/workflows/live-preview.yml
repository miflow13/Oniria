# Temporary public preview runner for hackathon QA/demo.
name: Oniria live preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oniria-live-preview-v2
  cancel-in-progress: true

jobs:
  preview:
    name: Build and expose Oniria
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start Oniria
        run: |
          nohup npm start > /tmp/oniria.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/oniria.log
          exit 1

      - name: Download cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Open public tunnel
        id: tunnel
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &

          preview_url=''
          for i in {1..60}; do
            preview_url=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$preview_url" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$preview_url" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "## Oniria live preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$preview_url**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_PREVIEW_URL=$preview_url"

      - name: Publish live preview URL
        run: |
          cat > .github/LIVE_PREVIEW.md <<EOF
          # Oniria live preview

          ${{ steps.tunnel.outputs.url }}

          Built from commit: $GITHUB_SHA

          This is a temporary GitHub Actions preview and remains live while the preview workflow runner is active.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/LIVE_PREVIEW.md
          git commit -m "ci: publish live preview URL [skip ci]" || exit 0
          git push

      - name: Keep preview alive
        run: |
          echo "Preview: ${{ steps.tunnel.outputs.url }}"
          echo "This runner keeps the public preview alive for up to ~6 hours."
          sleep 20700
